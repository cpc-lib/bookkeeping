server:
  port: 8080

spring:
  application:
    name: bookkeeping-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.1.200:3308/bookkeeping?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: cpc!23#@
  redis:
    host: 192.168.1.200
    port: 6379
    database: 0
    timeout: 5s
    password: cpc!23#@
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 2
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # 应用启动时自动执行建表脚本(表已存在则跳过)
  sql:
    init:
      mode: always
      continue-on-error: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted

# JWT 双Token配置
jwt:
  secret: hmeeDy8GlyFLHSXomVAReaiUIhy6sI0aVQcodSfqryAq8mdLO
  # accessToken 有效期 2 小时
  access-token-expire: 7200000
  # refreshToken 有效期 7 天
  refresh-token-expire: 604800000

# MinIO 对象存储配置
minio:
  endpoint: http://192.168.1.200:39000
  access-key: admin
  secret-key: hjm029796
  # 凭证图片所在桶, 启动时自动创建并开放匿名只读
